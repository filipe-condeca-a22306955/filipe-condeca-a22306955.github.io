<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Loja</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <h1>Loja</h1>
      <nav>
        <ul>
          <li><a href="#produtos">Produtos</a></li>
          <li><a href="#cesto">Cesto</a></li>
        </ul>

        <select id="categoria">
          <option value="">Todas as categorias</option>
        </select>

        <select id="ordenacao">
          <option value="">Ordenar por preço</option>
          <option value="asc">Preço crescente</option>
          <option value="desc">Preço decrescente</option>
        </select>

        <input type="text" id="pesquisa" placeholder="Pesquisar produto..." />
      </nav>
    </header>

    <main>
      <section id="produtos">
        <h2>Produtos</h2>
        <div class="lista-produtos"></div>
      </section>

      <section id="cesto">
        <h2>Cesto de Compras</h2>
        <div class="cesto-produtos"></div>
        <h3 class="preco-total">Preço total: 0 €</h3>
      </section>

      <section id="pagamento">
        <input type="text" id="coupon" placeholder="Cupão" />

        <label>
          <input type="checkbox" id="student" />
          És estudante do DEISI?
        </label>

        <button id="comprar">Comprar</button>

        <p>Preço final: <span id="total"></span></p>
        <p>Referência: <span id="referencia"></span></p>
      </section>
    </main>

    <footer></footer>
    <script src="main.js"></script>
  </body>
</html>
